<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DLS KIT LAND</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:#07111f;
color:#eef5ff;
font-family:Tahoma,Arial,sans-serif;
min-height:100vh
}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

header{
position:sticky;
top:0;
z-index:100;
height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
background:rgba(7,17,31,.82);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.08)
}

.brand{
font-size:20px;
font-weight:900;
letter-spacing:.5px
}

.brand span{color:#35a7ff}

.menu-btn{
width:44px;
height:44px;
border:0;
border-radius:13px;
background:#101f34;
color:#fff;
font-size:23px
}

.side{
position:fixed;
top:0;
right:-290px;
width:280px;
height:100%;
z-index:300;
background:#0a1728;
border-left:1px solid rgba(255,255,255,.08);
padding:80px 18px 20px;
transition:.28s
}

.side.open{right:0}

.side button{
width:100%;
border:0;
background:transparent;
color:#dceaff;
padding:15px;
margin:3px 0;
border-radius:12px;
text-align:right
}

.side button:hover{background:#12243b}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:250;
display:none
}

.overlay.show{display:block}

main{
max-width:1180px;
margin:auto;
padding:25px 15px 70px
}

.hero{
padding:45px 20px;
text-align:center;
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
background:
radial-gradient(circle at 50% 0,#12365d 0,transparent 55%),
linear-gradient(145deg,#0c1b2e,#081321);
box-shadow:0 20px 70px rgba(0,0,0,.25)
}

.hero h1{
font-size:clamp(32px,8vw,62px);
margin:0 0 10px;
font-weight:1000
}

.hero h1 span{color:#35a7ff}

.hero p{
color:#a9bad0;
margin:0 auto 25px;
font-size:15px
}

.actions{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap
}

.btn{
border:0;
padding:12px 19px;
border-radius:13px;
background:#168cff;
color:#fff;
font-weight:800;
transition:.2s
}

.btn:hover{transform:translateY(-2px)}

.btn.secondary{
background:#13253c;
border:1px solid rgba(255,255,255,.08)
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:22px
}

.stat{
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.07);
padding:15px;
border-radius:17px
}

.stat b{
display:block;
font-size:22px
}

.stat small{color:#8fa5bd}

.section{
margin-top:30px
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:15px
}

.section-head h2{
margin:0;
font-size:22px
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:14px
}

.card{
background:linear-gradient(145deg,#0d1c2f,#0a1727);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:14px;
transition:.22s;
overflow:hidden
}

.card:hover{
transform:translateY(-4px);
border-color:rgba(53,167,255,.35)
}

.team-card{
text-align:center;
padding:22px 14px
}

.team-icon{
width:76px;
height:76px;
border-radius:50%;
margin:auto auto 12px;
display:flex;
align-items:center;
justify-content:center;
background:#12263e;
font-size:28px;
font-weight:900;
overflow:hidden
}

.team-icon img{
width:100%;
height:100%;
object-fit:cover
}

.card h3{
margin:8px 0 5px;
font-size:17px
}

.muted{
color:#8fa5bd;
font-size:13px
}

.kit-img{
width:100%;
aspect-ratio:1;
object-fit:contain;
background:rgba(255,255,255,.025);
border-radius:14px;
display:block
}

.kit-info{
padding-top:11px
}

.tag{
display:inline-block;
font-size:11px;
padding:5px 8px;
border-radius:8px;
background:#132e49;
color:#76c5ff;
margin-bottom:5px
}

.card-actions{
display:flex;
gap:7px;
margin-top:10px
}

.card-actions button{
flex:1;
border:0;
padding:9px 7px;
border-radius:10px;
background:#142940;
color:#fff;
font-size:12px
}

.card-actions button.primary{
background:#168cff
}

.search-box{
display:flex;
gap:9px;
margin-bottom:18px
}

.search-box input{
flex:1;
min-width:0;
padding:14px 16px;
border-radius:14px;
border:1px solid rgba(255,255,255,.1);
background:#0c1b2c;
color:#fff;
outline:none
}

.search-box input:focus{
border-color:#168cff
}

.empty{
padding:35px 15px;
text-align:center;
color:#91a5bb
}

.channel{
display:flex;
align-items:center;
gap:16px;
padding:18px;
border-radius:20px;
background:linear-gradient(145deg,#0d1d31,#0a1727);
border:1px solid rgba(255,255,255,.08)
}

.channel-logo{
width:86px;
height:86px;
border-radius:50%;
overflow:hidden;
flex-shrink:0;
border:3px solid rgba(53,167,255,.5);
box-shadow:0 8px 30px rgba(0,0,0,.4);
background:#111827
}

.channel-logo img{
width:100%;
height:100%;
display:block;
object-fit:cover
}

.channel h3{
margin:0 0 5px
}

.channel p{
margin:0 0 10px;
color:#91a5bb;
font-size:13px
}

.ai{
padding:18px;
border-radius:20px;
background:linear-gradient(145deg,#101f34,#0b1727);
border:1px solid rgba(255,255,255,.08)
}

.ai-box{
height:260px;
overflow:auto;
padding:8px;
background:#07111f;
border-radius:15px;
margin-bottom:10px
}

.msg{
padding:10px 12px;
border-radius:12px;
margin:7px 0;
max-width:88%;
font-size:13px;
line-height:1.8
}

.msg.bot{
background:#12263d;
margin-left:auto
}

.msg.user{
background:#126fc4;
margin-right:auto
}

.ai-row{
display:flex;
gap:8px
}

.ai-row input{
flex:1;
min-width:0;
padding:12px;
border-radius:12px;
border:1px solid rgba(255,255,255,.1);
background:#0d1b2d;
color:#fff
}

.modal{
position:fixed;
inset:0;
z-index:500;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.86);
padding:15px
}

.modal.show{display:flex}

.modal-inner{
position:relative;
max-width:700px;
width:100%
}

.modal img{
width:100%;
max-height:85vh;
object-fit:contain
}

.close{
position:absolute;
top:-10px;
left:-5px;
width:42px;
height:42px;
border:0;
border-radius:50%;
background:#172b43;
color:#fff;
font-size:23px;
z-index:2
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translate(-50%,20px);
opacity:0;
pointer-events:none;
z-index:700;
background:#10243a;
border:1px solid rgba(255,255,255,.1);
padding:11px 16px;
border-radius:12px;
transition:.25s;
font-size:13px
}

.toast.show{
opacity:1;
transform:translate(-50%,0)
}

footer{
text-align:center;
padding:25px 15px;
color:#71869d;
font-size:12px
}

.back{
margin-bottom:15px
}

@media(max-width:600px){
.stats{grid-template-columns:1fr}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{border-radius:16px}
.hero{padding:35px 14px}
.channel{align-items:flex-start}
.channel-logo{width:70px;height:70px}
}

@media(max-width:380px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

const $=x=>document.querySelector(x);

function openMenu(){
$("#side").classList.add("open");
$("#overlay").classList.add("show")
}

function closeMenu(){
$("#side").classList.remove("open");
$("#overlay").classList.remove("show")
}

function esc(s){
return String(s).replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]))
}

function toast(t){
const x=$("#toast");
x.textContent=t;
x.classList.add("show");
clearTimeout(window.__t);
window.__t=setTimeout(()=>x.classList.remove("show"),2200)
}

function copy(t){
if(navigator.clipboard){
navigator.clipboard.writeText(t).then(()=>toast("لینک کپی شد"))
}else{
const x=document.createElement("textarea");
x.value=t;
document.body.appendChild(x);
x.select();
document.execCommand("copy");
x.remove();
toast("لینک کپی شد")
}
}

function image(url,name){
return `<img class="kit-img" loading="lazy" src="${esc(url)}" alt="${esc(name)}" onerror="this.style.opacity='.2'">`
}

function teamIcon(name){
return `<div class="team-icon">${esc(name.slice(0,1).toUpperCase())}</div>`
}

function kitCard(team,season,k){
return `
<article class="card">
${image(k[1],team+" "+k[0])}
<div class="kit-info">
<span class="tag">${esc(k[0])}</span>
<h3>${esc(team)}</h3>
<div class="muted">${esc(season)} • DLS 2019</div>
<div class="card-actions">
<button class="primary" onclick="window.open('${esc(k[1])}','_blank')">باز کردن PNG</button>
<button onclick="copy('${esc(k[1])}')">کپی لینک</button>
</div>
</div>
</article>`
}

function teamsHTML(){
return D.map(t=>`
<article class="card team-card" onclick="go('#team='+encodeURIComponent(t[0]))">
${teamIcon(t[0])}
<h3>${esc(t[0])}</h3>
<div class="muted">${esc(t[1])} • ${t[2].length} کیت</div>
</article>`).join("")
}

function allKits(){
let a=[];
D.forEach(t=>t[2].forEach(k=>a.push([t[0],t[1],k])));
return a
}

function searchPage(){
$("#app").innerHTML=`
<section class="section">
<div class="section-head">
<h2>⌕ جستجوی کیت</h2>
</div>
<div class="search-box">
<input id="searchInput" autofocus placeholder="نام تیم، نوع کیت یا فصل..." oninput="doSearch(this.value)">
</div>
<div id="results" class="grid"></div>
</section>`
doSearch("")
}

function doSearch(q){
q=q.trim().toLowerCase();
const out=$("#results");
if(!out)return;

const r=allKits().filter(x=>{
const s=(x[0]+" "+x[1]+" "+x[2][0]+" "+x[2][1]).toLowerCase();
return !q||s.includes(q)
});

out.innerHTML=r.length
?r.map(x=>kitCard(x[0],x[1],x[2])).join("")
:`<div class="empty">نتیجه‌ای پیدا نشد.</div>`
}

function teamPage(name){
const t=D.find(x=>x[0]===name);
if(!t)return home();

localStorage.setItem("lastTeam",name);

$("#app").innerHTML=`
<section class="section">
<button class="btn secondary back" onclick="history.back()">← بازگشت</button>

<div class="hero" style="margin-bottom:20px">

</section>`
}

function askAI(){
const input=$("#aiinput");
const box=$("#aibox");
if(!input||!box)return;

const q=input.value.trim();
if(!q)return;

box.innerHTML+=`<div class="msg user">${esc(q)}</div>`;

let a="فعلاً اطلاعات کافی برای پاسخ به این سؤال ندارم.";
const x=q.toLowerCase();

if(x.includes("کیت")||x.includes("kit"))
a="برای دیدن کیت‌ها از منوی «کیت‌ها» وارد تیم موردنظر شو.";

else if(x.includes("دانلود")||x.includes("لینک"))
a="در صفحه هر تیم، دکمه «باز کردن PNG» لینک مستقیم تصویر کیت را باز می‌کند و با «کپی لینک» می‌توانی لینک را کپی کنی.";

else if(x.includes("dls"))
a="این سایت برای کیت‌های Dream League Soccer 2019 ساخته شده است.";

else if(x.includes("بارسا")||x.includes("barcelona"))
a="کیت‌های Barcelona 2026/2027 در بخش تیم‌ها قرار دارند.";

else if(x.includes("psg"))
a="کیت‌های PSG 2027 در بخش تیم‌ها قرار دارند.";

else if(x.includes("سلام"))
a="سلام داداش 👋 چطور کمکت کنم؟";

box.scrollTop=box.scrollHeight;
input.value=""
}

function modal(url){
$("#modalImg").src=url;
$("#modal").classList.add("show")
}

function closeModal(){
$("#modal").classList.remove("show");
$("#modalImg").src=""
}

function go(hash){
location.hash=hash
}

function router(){
const h=decodeURIComponent(location.hash||"#home");

if(h==="#home"||h==="#")
home();
else if(h==="#kits")
home();
else if(h==="#search")
searchPage();
else if(h==="#guide")
guide();
else if(h==="#ai")
aiPage();
else if(h.startsWith("#team="))
teamPage(h.slice(6));
else
home();

window.scrollTo(0,0)
}

window.addEventListener("hashchange",router);
document.addEventListener("keydown",e=>{
if(e.key==="Escape"){
closeMenu();
closeModal()
}
});

router();
</script>
