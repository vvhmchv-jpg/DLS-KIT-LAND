<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070914">
<meta name="description" content="DLS KIT LAND — پلتفرم حرفه‌ای کیت‌های Dream League Soccer 2019">
<title>DLS KIT LAND — ULTRA</title>
<style>
/* =========================================================
   DLS KIT LAND ULTRA
   Single-file architecture: UI + data + routing + state + AI
   ========================================================= */
:root{
 --bg:#060812;--bg2:#0b1020;--panel:rgba(17,22,39,.78);
 --panel2:rgba(25,31,52,.86);--text:#f4f7ff;--muted:#9ba5bd;
 --line:rgba(255,255,255,.09);--accent:#7c5cff;--accent2:#00d9ff;
 --good:#35e29a;--warn:#ffcc66;--bad:#ff5c7a;--shadow:0 18px 60px rgba(0,0,0,.35);
 --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;min-height:100vh;background:
 radial-gradient(circle at 15% 0%,rgba(124,92,255,.17),transparent 30%),
 radial-gradient(circle at 85% 15%,rgba(0,217,255,.10),transparent 28%),
 linear-gradient(180deg,var(--bg),var(--bg2));
 color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.app{min-height:100vh}
.topbar{
 position:sticky;top:0;z-index:50;backdrop-filter:blur(22px);
 background:rgba(6,8,18,.72);border-bottom:1px solid var(--line);
}
.nav{max-width:1400px;margin:auto;min-height:70px;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:.5px}
.logo-mark{
 width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
 background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 30px rgba(124,92,255,.28)
}
.logo-mark:after{content:"⚽";filter:drop-shadow(0 3px 5px #000)}
.nav-search{flex:1;max-width:600px;margin:auto;position:relative}
.nav-search input{
 width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);
 border-radius:15px;padding:12px 16px;outline:none
}
.icon-btn,.btn{
 border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);
 border-radius:14px;padding:10px 13px;transition:.2s
}
.icon-btn:hover,.btn:hover{transform:translateY(-2px);border-color:rgba(124,92,255,.5)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5740d8);border-color:transparent}
.btn.good{background:rgba(53,226,154,.1);border-color:rgba(53,226,154,.3)}
.container{max-width:1400px;margin:auto;padding:22px 16px 100px}
.hero{
 position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;
 padding:30px;box-shadow:var(--shadow);background:
 linear-gradient(135deg,rgba(124,92,255,.16),rgba(0,217,255,.04) 55%,rgba(255,255,255,.025));
}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);pointer-events:none}
.hero:before{width:260px;height:260px;background:rgba(124,92,255,.16);right:-100px;top:-100px}
.hero:after{width:220px;height:220px;background:rgba(0,217,255,.10);left:-100px;bottom:-120px}
.hero>*{position:relative;z-index:1}
.kicker{color:#b8c1ff;font-weight:800;font-size:.88rem}
h1{font-size:clamp(2rem,6vw,4.8rem);line-height:.98;margin:10px 0 16px;letter-spacing:-2px}
.hero p{color:var(--muted);max-width:760px;line-height:1.9}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.section{margin-top:28px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section-head h2{margin:0;font-size:1.35rem}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{
 border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);
 box-shadow:0 12px 40px rgba(0,0,0,.18);transition:.25s;min-width:0
}
.card:hover{transform:translateY(-5px);border-color:rgba(124,92,255,.4)}
.kit-img{aspect-ratio:1/1;background:linear-gradient(135deg,#11182c,#090c18);display:grid;place-items:center;overflow:hidden}
.kit-img img{width:100%;height:100%;object-fit:contain;padding:8px}
.card-body{padding:14px}
.card-title{font-weight:900;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.tag{font-size:.72rem;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:#c9d1e7}
.card-actions{display:flex;gap:7px}.card-actions .btn{flex:1}
.team-card{padding:18px;display:flex;align-items:center;gap:13px}
.team-logo{width:54px;height:54px;border-radius:16px;background:#0b0f1c;object-fit:contain;padding:7px;border:1px solid var(--line)}
.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:22px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:5px}
.chip{white-space:nowrap}
.toolbar{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:800px){.toolbar{grid-template-columns:2fr 1fr 1fr 1fr}}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:.82rem;color:var(--muted)}
.field input,.field select,.field textarea{
 width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);
 background:rgba(255,255,255,.045);color:var(--text);outline:none
}
.field textarea{min-height:110px;resize:vertical}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:24px;padding:18px}
.modal-backdrop{
 position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);
 display:none;align-items:flex-end;justify-content:center;z-index:100;padding:12px
}
.modal-backdrop.show{display:flex}
.modal{width:min(850px,100%);max-height:92vh;overflow:auto;background:#0d1222;border:1px solid var(--line);border-radius:25px;padding:18px;box-shadow:var(--shadow)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.detail{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:760px){.detail{grid-template-columns:1fr 1fr}}
.detail-image{border:1px solid var(--line);border-radius:22px;background:#080c18;min-height:300px;display:grid;place-items:center}
.detail-image img{max-height:520px;object-fit:contain}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:15px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035)}
.stat b{display:block;font-size:1.4rem}
.ai-fab{
 position:fixed;left:18px;bottom:18px;z-index:70;width:60px;height:60px;border-radius:20px;border:1px solid rgba(255,255,255,.15);
 background:linear-gradient(135deg,#7c5cff,#00c9ff);color:white;font-size:25px;box-shadow:0 18px 50px rgba(0,0,0,.4)
}
.ai-window{
 position:fixed;left:18px;bottom:90px;width:min(390px,calc(100vw - 36px));height:560px;z-index:69;
 background:#0b1020;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
 display:none;overflow:hidden
}
.ai-window.show{display:flex;flex-direction:column}
.ai-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.ai-messages{flex:1;overflow:auto;padding:13px}
.msg{max-width:88%;padding:10px 12px;border-radius:16px;margin:7px 0;line-height:1.7;font-size:.9rem}
.msg.ai{background:rgba(124,92,255,.13);border:1px solid rgba(124,92,255,.2)}
.msg.user{background:rgba(255,255,255,.06);margin-right:auto}
.ai-input{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}
.ai-input input{flex:1;min-width:0}
.toast{
 position:fixed;right:16px;bottom:18px;z-index:200;padding:12px 16px;border-radius:14px;
 background:#151c30;border:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(30px);opacity:0;pointer-events:none;transition:.25s
}
.toast.show{transform:none;opacity:1}
.footer{margin-top:50px;padding:28px 0;color:var(--muted);border-top:1px solid var(--line);line-height:1.9}
.hide{display:none!important}
.loading{animation:pulse 1.1s infinite alternate}
@keyframes pulse{to{opacity:.45}}
@media(max-width:500px){.hero{padding:23px}.nav{min-height:62px}.nav-search{display:none}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
 <nav class="nav" aria-label="ناوبری">
  <a class="logo" href="#/" aria-label="DLS KIT LAND">
   <span class="logo-mark"></span><span>DLS KIT LAND</span>
  </a>
  <div class="nav-search"><input id="globalSearch" autocomplete="off" placeholder="جستجوی تیم، فصل یا نوع کیت..." aria-label="جستجو"></div>
  <button class="icon-btn" id="themeBtn" title="تغییر تم">☀️</button>
  <button class="icon-btn" id="menuBtn" title="منو">☰</button>
 </nav>
</header>

<main class="container" id="view"></main>

<footer class="footer container">
 <b>DLS KIT LAND</b> — پایگاه حرفه‌ای کیت‌های DLS 2019.<br>
 ساخته‌شده به‌صورت Single-File و مناسب GitHub Pages.
</footer>
</div>

<button class="ai-fab" id="aiFab" aria-label="DLS AI">🤖</button>
<section class="ai-window" id="aiWindow" aria-label="DLS AI">
 <div class="ai-head"><b>DLS AI</b><button class="icon-btn" id="aiClose">×</button></div>
 <div class="ai-messages" id="aiMessages"></div>
 <div class="ai-input"><input id="aiInput" placeholder="مثلاً: کیت بارسا رو پیدا کن"><button class="btn primary" id="aiSend">ارسال</button></div>
</section>
<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
 <div class="modal" id="modal"></div>
</div>

<script>
"use strict";
/* =========================================================
   CORE ENGINE
   ========================================================= */
const APP = {
 name:"DLS KIT LAND",
 version:"ULTRA 1.0",
 contact:"https://rubika.ir/fc_barcelona_1899_2027",
 channel:"https://rubika.ir/dls_kit_land",
 keys:{data:"dls_kit_land_ultra_data",theme:"dls_kit_land_ultra_theme",favs:"dls_kit_land_ultra_favs"},
 state:{route:"/",query:"",team:"all",season:"all",type:"all",sort:"new",favorites:false},
 data:null,
 els:{}
};

const seedTeams=[
 ["barcelona","Barcelona","بارسلونا","Europe","https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg"],
 ["real-madrid","Real Madrid","رئال مادرید","Europe",""],
 ["psg","PSG","پاری سن ژرمن","Europe",""],
 ["bayern","Bayern Munchen","بایرن مونیخ","Europe",""],
 ["inter","Inter Milan","اینتر میلان","Europe",""],
 ["ac-milan","AC Milan","آث میلان","Europe",""],
 ["juventus","Juventus","یوونتوس","Europe",""],
 ["dortmund","Dortmund","دورتموند","Europe",""],
 ["arsenal","Arsenal","آرسنال","Europe",""],
 ["man-city","Man City","منچسترسیتی","Europe",""],
 ["man-united","Man United","منچستریونایتد","Europe",""],
 ["liverpool","Liverpool","لیورپول","Europe",""],
 ["chelsea","Chelsea","چلسی","Europe",""],
 ["persepolis","Persepolis","پرسپولیس","Iran",""],
 ["esteghlal","Esteghlal","استقلال","Iran",""],
 ["sepahan","Sepahan","سپاهان","Iran",""],
 ["tractor","Tractor","تراکتور","Iran",""]
].map((x,i)=>({id:x[0],name:x[1],fa:x[2],region:x[3],logo:x[4],created:Date.now()-i*1000}));

const seedKits=[
 {id:"barca-2728-home",team:"barcelona",season:"2027/28",type:"Home",name:"Barcelona 27/28 Home",desc:"کیت اول بارسلونا برای DLS 2019 با طراحی سرمه‌ای و زرشکی و جزئیات طلایی.",image:"",download:"https://example.com/barca-2728-home.png",created:Date.now()-1000},
 {id:"barca-2728-away",team:"barcelona",season:"2027/28",type:"Away",name:"Barcelona 27/28 Away",desc:"کیت دوم بارسلونا برای DLS 2019.",image:"",download:"https://example.com/barca-2728-away.png",created:Date.now()-2000},
 {id:"milan-2728-home",team:"ac-milan",season:"2027/28",type:"Home",name:"AC Milan 27/28 Home",desc:"کیت اول میلان برای DLS 2019.",image:"",download:"https://example.com/milan-2728-home.png",created:Date.now()-3000},
 {id:"real-2727-home",team:"real-madrid",season:"2026/27",type:"Home",name:"Real Madrid 26/27 Home",desc:"نمونه کیت.",image:"",download:"https://example.com/real-home.png",created:Date.now()-4000}
];

function safeJSON(raw,fallback){try{return JSON.parse(raw)}catch{return fallback}}
function loadData(){
 const saved=safeJSON(localStorage.getItem(APP.keys.data),null);
 APP.data=saved&&Array.isArray(saved.teams)&&Array.isArray(saved.kits)
   ? saved : {teams:seedTeams,kits:seedKits};
}
function saveData(){localStorage.setItem(APP.keys.data,JSON.stringify(APP.data))}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(prefix="id"){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function teamById(id){return APP.data.teams.find(t=>t.id===id)}
function getFavs(){return safeJSON(localStorage.getItem(APP.keys.favs),[])}
function setFavs(a){localStorage.setItem(APP.keys.favs,JSON.stringify(a))}
function isFav(id){return getFavs().includes(id)}
function toggleFav(id){let a=getFavs();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];setFavs(a);toast(a.includes(id)?"به علاقه‌مندی‌ها اضافه شد":"از علاقه‌مندی‌ها حذف شد");render()}
function validUrl(u){
 try{const x=new URL(u);return ["http:","https:"].includes(x.protocol)}
 catch{return false}
}
function toast(msg){
 const e=APP.els.toast;e.textContent=msg;e.classList.add("show");
 clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2200)
}
function go(path){location.hash=path}
function parseRoute(){
 let h=decodeURIComponent(location.hash||"#/");if(h.startsWith("#"))h=h.slice(1);if(!h)h="/";
 APP.state.route=h;
}
function teamKits(teamId){return APP.data.kits.filter(k=>k.team===teamId)}
function seasons(){return [...new Set(APP.data.kits.map(k=>k.season))].sort().reverse()}
function kitTypes(){return [...new Set(APP.data.kits.map(k=>k.type))].sort()}
function filteredKits(){
 let a=[...APP.data.kits],s=APP.state;
 const q=s.query.trim().toLowerCase();
 if(q)a=a.filter(k=>{
   const t=teamById(k.team)||{};
   return [k.name,k.season,k.type,t.name,t.fa].join(" ").toLowerCase().includes(q)
 });
 if(s.team!=="all")a=a.filter(k=>k.team===s.team);
 if(s.season!=="all")a=a.filter(k=>k.season===s.season);
 if(s.type!=="all")a=a.filter(k=>k.type===s.type);
 if(s.favorites)a=a.filter(k=>isFav(k.id));
 a.sort((x,y)=>s.sort==="name"?x.name.localeCompare(y.name):s.sort==="season"?String(y.season).localeCompare(String(x.season)):y.created-x.created);
 return a;
}

/* =========================================================
   RENDER SYSTEM
   ========================================================= */
function img(src,alt,cls=""){
 const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#0d1324"/><text x="200" y="210" text-anchor="middle" fill="#69738e" font-size="30">DLS KIT</text></svg>`);
 return `<img class="${cls}" src="${esc(src||fallback)}" alt="${esc(alt)}" loading="lazy" onerror="this.onerror=null;this.src='${fallback}'">`
}
function kitCard(k){
 const t=teamById(k.team)||{name:"Unknown",fa:""};
 return `<article class="card">
  <div class="kit-img">${img(k.image,k.name)}</div>
  <div class="card-body">
   <div class="card-title">${esc(k.name)}</div>
   <div class="muted">${esc(t.fa||t.name)}</div>
   <div class="tags"><span class="tag">${esc(k.season)}</span><span class="tag">${esc(k.type)}</span></div>
   <div class="card-actions">
    <button class="btn primary" onclick="openKit('${esc(k.id)}')">مشاهده</button>
    <button class="btn" onclick="toggleFav('${esc(k.id)}')" aria-label="علاقه‌مندی">${isFav(k.id)?"★":"☆"}</button>
   </div>
  </div>
 </article>`
}
function teamCard(t){
 return `<article class="card team-card" onclick="go('/team/${encodeURIComponent(t.id)}')" role="button" tabindex="0">
   ${img(t.logo,t.name,"team-logo")}
   <div><b>${esc(t.fa)}</b><div class="muted">${esc(t.name)}</div><small>${teamKits(t.id).length} کیت</small></div>
 </article>`
}
function home(){
 const kits=[...APP.data.kits].sort((a,b)=>b.created-a.created).slice(0,8);
 const teams=APP.data.teams.slice(0,12);
 return `<section class="hero">
  <div class="kicker">DLS 2019 • ULTRA EDITION</div>
  <h1>کیت‌های DLS 2019<br>در یک لند حرفه‌ای</h1>
  <p>کیت تیم‌ها را جستجو کن، فصل و نوع را فیلتر کن، لینک مستقیم را کپی کن و مجموعه شخصی خودت را بساز.</p>
  <div class="hero-actions">
   <a class="btn primary" href="#/kits">مشاهده کیت‌ها</a>
   <a class="btn" href="#/teams">تیم‌ها</a>
   <button class="btn" onclick="openAdmin()">مدیریت</button>
  </div>
 </section>
 <section class="section"><div class="section-head"><h2>آخرین کیت‌ها</h2><a class="muted" href="#/kits">همه →</a></div><div class="grid">${kits.length?kits.map(kitCard).join(""):`<div class="empty">هنوز کیتی ثبت نشده.</div>`}</div></section>
 <section class="section"><div class="section-head"><h2>تیم‌ها</h2><a class="muted" href="#/teams">همه →</a></div><div class="grid">${teams.map(teamCard).join("")}</div></section>`
}
function kitsPage(){
 return `<section class="panel">
  <div class="section-head"><div><h2>کتابخانه کیت‌ها</h2><div class="muted">${filteredKits().length} نتیجه</div></div>
   <button class="btn" onclick="APP.state.favorites=!APP.state.favorites;render()">${APP.state.favorites?"★ همه":"☆ علاقه‌مندی‌ها"}</button>
  </div>
  <div class="toolbar">
   <div class="field"><label>جستجو</label><input id="q" value="${esc(APP.state.query)}" placeholder="بارسا، 2027/28، Home..."></div>
   <div class="field"><label>تیم</label><select id="teamFilter"><option value="all">همه تیم‌ها</option>${APP.data.teams.map(t=>`<option value="${esc(t.id)}" ${APP.state.team===t.id?"selected":""}>${esc(t.fa)}</option>`).join("")}</select></div>
   <div class="field"><label>فصل</label><select id="seasonFilter"><option value="all">همه فصل‌ها</option>${seasons().map(x=>`<option ${APP.state.season===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
   <div class="field"><label>نوع</label><select id="typeFilter"><option value="all">همه</option>${kitTypes().map(x=>`<option ${APP.state.type===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
  </div>
 </section>
 <section class="section"><div class="grid">${filteredKits().map(kitCard).join("")||`<div class="empty">نتیجه‌ای پیدا نشد.</div>`}</div></section>`
}
function teamsPage(){
 return `<section class="hero"><div class="kicker">TEAM DIRECTORY</div><h1>تیم‌ها</h1><p>مجموعه تیم‌های موجود در دیتابیس DLS KIT LAND.</p></section>
 <section class="section"><div class="grid">${APP.data.teams.map(teamCard).join("")}</div></section>`
}
function teamPage(id){
 const t=teamById(id);if(!t)return notFound();
 const ks=teamKits(id);
 return `<section class="hero"><div class="kicker">${esc(t.name)}</div><h1>${esc(t.fa)}</h1><p>${ks.length} کیت ثبت شده برای این تیم.</p>
 <div class="hero-actions"><button class="btn" onclick="go('/kits');APP.state.team='${esc(id)}';render()">نمایش همه کیت‌ها</button></div></section>
 <section class="section"><div class="grid">${ks.map(kitCard).join("")||`<div class="empty">برای این تیم کیتی ثبت نشده.</div>`}</div></section>`
}
function kitPage(id){
 const k=APP.data.kits.find(x=>x.id===id);if(!k)return notFound();
 const t=teamById(k.team)||{name:"",fa:""};
 return `<section class="detail">
  <div class="detail-image">${img(k.image,k.name)}</div>
  <div class="panel">
   <div class="kicker">${esc(k.type)} • ${esc(k.season)}</div><h1 style="font-size:2.4rem">${esc(k.name)}</h1>
   <p class="muted" style="line-height:2">${esc(k.desc)}</p>
   <div class="tags"><span class="tag">${esc(t.fa)}</span><span class="tag">${esc(k.season)}</span><span class="tag">${esc(k.type)}</span></div>
   <div class="hero-actions">
    <a class="btn primary" href="${esc(k.download)}" target="_blank" rel="noopener">دانلود مستقیم</a>
    <button class="btn" onclick="copyText('${esc(k.download)}')">کپی لینک</button>
    <button class="btn" onclick="toggleFav('${esc(k.id)}')">${isFav(k.id)?"★ حذف علاقه‌مندی":"☆ علاقه‌مندی"}</button>
    <button class="btn" onclick="shareKit('${esc(k.id)}')">اشتراک‌گذاری</button>
   </div>
   <div class="stats" style="margin-top:18px"><div class="stat"><span class="muted">تیم</span><b>${esc(t.fa)}</b></div><div class="stat"><span class="muted">نوع</span><b>${esc(k.type)}</b></div></div>
  </div>
 </section>`
}
function searchPage(){
 return `<section class="hero"><div class="kicker">SMART SEARCH</div><h1>جستجوی هوشمند</h1><p>نام تیم، فصل، نوع کیت یا بخشی از نام را وارد کن.</p>
 <div class="hero-actions"><input id="searchBig" style="min-width:min(700px,100%);padding:15px;border-radius:16px;border:1px solid var(--line);background:#ffffff08;color:white" value="${esc(APP.state.query)}" placeholder="مثلاً Barcelona 2027/28 Home"></div></section>
 <section class="section"><div class="grid">${filteredKits().map(kitCard).join("")||`<div class="empty">چیزی پیدا نشد.</div>`}</div></section>`
}
function guidePage(){
 return `<section class="hero"><div class="kicker">GUIDE</div><h1>راهنمای DLS 2019</h1><p>برای استفاده از کیت، صفحه کیت را باز کن و لینک مستقیم را دریافت کن.</p></section>
 <section class="section panel"><h2>نحوه استفاده</h2><ol style="line-height:2.2"><li>تیم را پیدا کن.</li><li>فصل و نوع کیت را انتخاب کن.</li><li>روی «دانلود مستقیم» بزن.</li><li>لینک را در بازی یا ابزار مربوط به کیت وارد کن.</li></ol></section>`
}
function statsPage(){
 const total=APP.data.kits.length,teams=APP.data.teams.length,favs=getFavs().length;
 return `<section class="hero"><div class="kicker">SYSTEM DASHBOARD</div><h1>آمار سایت</h1><p>نمای کلی دیتابیس محلی این نسخه.</p></section>
 <section class="section"><div class="stats"><div class="stat"><span class="muted">کیت‌ها</span><b>${total}</b></div><div class="stat"><span class="muted">تیم‌ها</span><b>${teams}</b></div><div class="stat"><span class="muted">فصل‌ها</span><b>${seasons().length}</b></div><div class="stat"><span class="muted">علاقه‌مندی</span><b>${favs}</b></div></div></section>`
}
function notFound(){return `<section class="hero"><div class="kicker">404</div><h1>صفحه پیدا نشد</h1><p>آدرس موردنظر در DLS KIT LAND وجود ندارد.</p><a class="btn primary" href="#/">بازگشت به خانه</a></section>`}

/* =========================================================
   ADMIN
   ========================================================= */
function openAdmin(){
 APP.els.modal.innerHTML=`<div class="modal-head"><h2>مدیریت دیتابیس</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
 <div class="panel" style="margin-bottom:12px">
  <div class="section-head"><h3>افزودن کیت</h3><span class="muted">ذخیره محلی مرورگر</span></div>
  <div class="toolbar">
   <div class="field"><label>نام</label><input id="aName"></div>
   <div class="field"><label>تیم</label><select id="aTeam">${APP.data.teams.map(t=>`<option value="${esc(t.id)}">${esc(t.fa)}</option>`).join("")}</select></div>
   <div class="field"><label>فصل</label><input id="aSeason" placeholder="2027/28"></div>
   <div class="field"><label>نوع</label><select id="aType">${["Home","Away","Third","GK1","GK2","GK3"].map(x=>`<option>${x}</option>`).join("")}</select></div>
  </div>
  <div class="field" style="margin-top:10px"><label>Image URL</label><input id="aImage"></div>
  <div class="field" style="margin-top:10px"><label>Download URL</label><input id="aDownload"></div>
  <div class="field" style="margin-top:10px"><label>توضیحات</label><textarea id="aDesc"></textarea></div>
  <button class="btn primary" style="margin-top:10px" onclick="addKit()">افزودن کیت</button>
 </div>
 <div class="panel">
  <div class="section-head"><h3>عملیات</h3></div>
  <div class="hero-actions">
   <button class="btn" onclick="exportData()">Export JSON</button>
   <button class="btn" onclick="document.getElementById('importFile').click()">Import JSON</button>
   <button class="btn" onclick="resetData()">بازنشانی دیتابیس</button>
   <input id="importFile" type="file" accept="application/json" class="hide">
  </div>
 </div>`;
 APP.els.modalBackdrop.classList.add("show");
 document.getElementById("importFile").addEventListener("change",importData)
}
function addKit(){
 const name=document.getElementById("aName").value.trim(),team=document.getElementById("aTeam").value;
 const season=document.getElementById("aSeason").value.trim(),type=document.getElementById("aType").value;
 const image=document.getElementById("aImage").value.trim(),download=document.getElementById("aDownload").value.trim(),desc=document.getElementById("aDesc").value.trim();
 if(!name||!season||!validUrl(download)){toast("نام، فصل و لینک دانلود معتبر لازم است");return}
 if(image&&!validUrl(image)){toast("لینک تصویر معتبر نیست");return}
 APP.data.kits.unshift({id:uid("kit"),name,team,season,type,image,download,desc,created:Date.now()});
 saveData();closeModal();toast("کیت اضافه شد");render()
}
function exportData(){
 const blob=new Blob([JSON.stringify(APP.data,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="dls-kit-land-data.json";a.click();URL.revokeObjectURL(a.href)
}
function importData(e){
 const file=e.target.files?.[0];if(!file)return;
 const r=new FileReader();r.onload=()=>{
  const d=safeJSON(r.result,null);
  if(!d||!Array.isArray(d.teams)||!Array.isArray(d.kits)){toast("فایل دیتابیس معتبر نیست");return}
  APP.data=d;saveData();closeModal();render();toast("دیتابیس وارد شد")
 };r.readAsText(file)
}
function resetData(){if(confirm("دیتابیس محلی بازنشانی شود؟")){APP.data={teams:seedTeams,kits:seedKits};saveData();closeModal();render();toast("بازنشانی شد")}}
function closeModal(){APP.els.modalBackdrop.classList.remove("show")}

/* =========================================================
   AI — LOCAL KNOWLEDGE ENGINE
   ========================================================= */
const AI_RULES=[
 [/سلام|درود|هلو/,"سلام داداش! 👊 من DLS AI همین نسخه‌ام. درباره کیت‌ها، تیم‌ها، جستجو و امکانات سایت بپرس."],
 [/کیت.*بارسا|بارسا.*کیت|barcelona/i,()=>{const x=teamById("barcelona");const n=teamKits("barcelona").length;return `برای ${x?.fa||"بارسلونا"} الان ${n} کیت در دیتابیس هست. می‌تونی از بخش تیم‌ها واردش بشی.`}],
 [/چند.*کیت|تعداد.*کیت/ ,()=>`در حال حاضر ${APP.data.kits.length} کیت و ${APP.data.teams.length} تیم در دیتابیس محلی داری.`],
 [/دانلود|لینک/,"برای هر کیت، صفحه جزئیات یک دکمه «دانلود مستقیم» و یک گزینه «کپی لینک» دارد."],
 [/ادمین|مدیریت/,"از صفحه اصلی روی «مدیریت» بزن. این نسخه امکان افزودن کیت و Import/Export JSON را دارد. برای احراز هویت واقعی باید Backend اضافه شود."],
 [/دلس|dls/i,"DLS KIT LAND برای مدیریت و ارائه کیت‌های Dream League Soccer 2019 طراحی شده و کاملاً Single-File است."],
 [/کمک|راهنما/,"می‌تونی بپرسی: «کیت بارسا چندتاست؟»، «چطور کیت اضافه کنم؟»، «چطور لینک رو کپی کنم؟» یا درباره امکانات سایت سؤال کنی."]
];
function aiAnswer(q){
 for(const [rx,ans] of AI_RULES)if(rx.test(q))return typeof ans==="function"?ans():ans;
 return "این نسخه AI محلی است و بدون API کار می‌کند. سؤال را درباره DLS KIT LAND، کیت‌ها، تیم‌ها یا امکانات سایت دقیق‌تر بنویس.";
}
function aiAdd(text,type="ai"){
 const d=document.createElement("div");d.className="msg "+type;d.textContent=text;
 APP.els.aiMessages.appendChild(d);APP.els.aiMessages.scrollTop=APP.els.aiMessages.scrollHeight
}
function aiSend(){
 const q=APP.els.aiInput.value.trim();if(!q)return;
 aiAdd(q,"user");APP.els.aiInput.value="";
 setTimeout(()=>aiAdd(aiAnswer(q)),180)
}

/* =========================================================
   UTILITIES / EVENTS
   ========================================================= */
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast("لینک کپی شد")).catch(()=>{prompt("کپی کن:",t)})}
async function shareKit(id){
 const k=APP.data.kits.find(x=>x.id===id);if(!k)return;
 const url=location.href.split("#")[0]+"#/kit/"+encodeURIComponent(id);
 if(navigator.share){try{await navigator.share({title:k.name,text:"DLS KIT LAND",url})}catch{}}
 else copyText(url)
}
function openKit(id){go("/kit/"+encodeURIComponent(id))}
function render(){
 parseRoute();
 const r=APP.state.route.split("/").filter(Boolean);
 let html;
 if(!r.length)html=home();
 else if(r[0]==="kits")html=kitsPage();
 else if(r[0]==="teams")html=teamsPage();
 else if(r[0]==="team")html=teamPage(r[1]);
 else if(r[0]==="kit")html=kitPage(r[1]);
 else if(r[0]==="search")html=searchPage();
 else if(r[0]==="guide")html=guidePage();
 else if(r[0]==="stats")html=statsPage();
 else html=notFound();
 APP.els.view.innerHTML=html;
 bindPageEvents()
}
function renderKitsOnly(){
  const grid=document.querySelector("#view .section:last-child .grid");
  const count=document.querySelector("#view .section:first-of-type .section-head .muted");
  if(grid) grid.innerHTML=filteredKits().map(kitCard).join("")||`<div class="empty">نتیجه‌ای پیدا نشد.</div>`;
  if(count) count.textContent=filteredKits().length+" نتیجه";
}
function renderSearchOnly(){
  const grid=document.querySelector("#view .section:last-child .grid");
  if(grid) grid.innerHTML=filteredKits().map(kitCard).join("")||`<div class="empty">چیزی پیدا نشد.</div>`;
}
function bindPageEvents(){
 const q=document.getElementById("q");if(q)q.addEventListener("input",e=>{APP.state.query=e.target.value;renderKitsOnly()});
 const b=document.getElementById("searchBig");if(b)b.addEventListener("input",e=>{APP.state.query=e.target.value;renderSearchOnly()});
 const tf=document.getElementById("teamFilter");if(tf)tf.addEventListener("change",e=>{APP.state.team=e.target.value;render()});
 const sf=document.getElementById("seasonFilter");if(sf)sf.addEventListener("change",e=>{APP.state.season=e.target.value;render()});
 const yf=document.getElementById("typeFilter");if(yf)yf.addEventListener("change",e=>{APP.state.type=e.target.value;render()});
}
function applyTheme(theme){
 if(theme==="light"){
  document.documentElement.style.setProperty("--bg","#f4f6fb");
  document.documentElement.style.setProperty("--bg2","#e9edf7");
  document.documentElement.style.setProperty("--panel","rgba(255,255,255,.82)");
  document.documentElement.style.setProperty("--panel2","rgba(255,255,255,.92)");
  document.documentElement.style.setProperty("--text","#111827");
  document.documentElement.style.setProperty("--muted","#5f6b80");
 }else{
  document.documentElement.style.setProperty("--bg","#060812");
  document.documentElement.style.setProperty("--bg2","#0b1020");
  document.documentElement.style.setProperty("--panel","rgba(17,22,39,.78)");
  document.documentElement.style.setProperty("--panel2","rgba(25,31,52,.86)");
  document.documentElement.style.setProperty("--text","#f4f7ff");
  document.documentElement.style.setProperty("--muted","#9ba5bd");
 }
}
function initTheme(){
 const saved=localStorage.getItem(APP.keys.theme)||"dark";
 document.documentElement.dataset.theme=saved;
 applyTheme(saved);
}
function toggleTheme(){
 const n=document.documentElement.dataset.theme==="dark"?"light":"dark";
 document.documentElement.dataset.theme=n;
 localStorage.setItem(APP.keys.theme,n);
 applyTheme(n);
 toast(n==="light"?"حالت روشن فعال شد":"حالت تاریک فعال شد");
}
function init(){
 APP.els={view:document.getElementById("view"),toast:document.getElementById("toast"),modal:document.getElementById("modal"),modalBackdrop:document.getElementById("modalBackdrop"),aiWindow:document.getElementById("aiWindow"),aiMessages:document.getElementById("aiMessages"),aiInput:document.getElementById("aiInput")};
 loadData();initTheme();render();
 document.getElementById("themeBtn").onclick=toggleTheme;
 document.getElementById("menuBtn").onclick=(e)=>{e.preventDefault();openMenu()};
 document.getElementById("globalSearch").addEventListener("input",e=>{APP.state.query=e.target.value;go("/search")});
 document.getElementById("aiFab").onclick=()=>{APP.els.aiWindow.classList.toggle("show");if(APP.els.aiMessages.children.length===0)aiAdd("سلام! من DLS AI هستم. چه کمکی می‌خوای؟")};
 document.getElementById("aiClose").onclick=()=>APP.els.aiWindow.classList.remove("show");
 document.getElementById("aiSend").onclick=aiSend;
 APP.els.aiInput.addEventListener("keydown",e=>{if(e.key==="Enter")aiSend()});
 APP.els.modalBackdrop.addEventListener("click",e=>{if(e.target===APP.els.modalBackdrop)closeModal()});
 window.addEventListener("hashchange",render);
}
function openMenu(){
 APP.els.modal.innerHTML=`<div class="modal-head"><h2>منوی DLS KIT LAND</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
 <div class="grid">
 ${[
  ["/","خانه"],["/kits","کیت‌ها"],["/teams","تیم‌ها"],["/search","جستجو"],["/guide","راهنما"],["/stats","آمار"]
 ].map(x=>`<a class="btn" href="#${x[0]}" onclick="closeModal()">${x[1]}</a>`).join("")}
 <a class="btn" href="${APP.channel}" target="_blank" rel="noopener">کانال روبیکا</a>
 <a class="btn" href="${APP.contact}" target="_blank" rel="noopener">تماس</a>
 </div>`;
 APP.els.modalBackdrop.classList.add("show")
}
window.APP=APP;window.render=render;window.go=go;window.openKit=openKit;window.toggleFav=toggleFav;window.openAdmin=openAdmin;window.closeModal=closeModal;window.addKit=addKit;window.exportData=exportData;window.resetData=resetData;window.copyText=copyText;window.shareKit=shareKit;
init();
</script>
</body>
</html>
